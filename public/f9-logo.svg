<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="bg" cx="0.22" cy="0.12" r="1.05">
      <stop offset="0" stop-color="#3f6b60"/>
      <stop offset="0.35" stop-color="#16382f"/>
      <stop offset="1" stop-color="#051a14"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5f9c8a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5f9c8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#f7fffb"/>
      <stop offset="0.45" stop-color="#c9e3d7"/>
      <stop offset="1" stop-color="#6f9d8c"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- fundo: degradê verde-escuro com brilhos difusos -->
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="180" cy="90" r="300" fill="url(#glow)"/>
  <circle cx="1050" cy="700" r="260" fill="url(#glow)" opacity="0.6"/>

  <!-- ===== F (formas da logo enviada) ===== -->
  <g id="F">
    <!-- sombra suave -->
    <g fill="#000" opacity="0.35" filter="url(#soft)" transform="translate(18,26)">
      <polygon points="212,203 294,203 294,563 212,490"/>
      <polygon points="310,203 572,203 482,303 310,303"/>
      <polygon points="310,340 500,340 410,438 310,438"/>
    </g>
    <!-- contorno fantasma deslocado -->
    <g fill="none" stroke="#7fe8c4" stroke-opacity="0.45" stroke-width="2" transform="translate(22,22)">
      <polygon points="212,203 294,203 294,563 212,490"/>
      <polygon points="310,203 572,203 482,303 310,303"/>
      <polygon points="310,340 500,340 410,438 310,438"/>
    </g>
    <!-- vidro -->
    <g fill="url(#glass)" fill-opacity="0.96" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">
      <polygon points="212,203 294,203 294,563 212,490"/>
      <polygon points="310,203 572,203 482,303 310,303"/>
      <polygon points="310,340 500,340 410,438 310,438"/>
    </g>
  </g>

  <!-- ===== 9 (mesmo estilo: vidro, contorno branco, fantasma) ===== -->
  <g id="NINE" transform="translate(600,0)">
    <g fill="#000" opacity="0.35" filter="url(#soft)" transform="translate(18,26)">
      <polygon points="212,203 572,203 482,303 212,303"/>
      <polygon points="212,203 294,203 294,438 212,438"/>
      <polygon points="294,340 500,340 410,438 294,438"/>
      <polygon points="490,303 572,203 572,490 490,565 410,565 450,490"/>
    </g>
    <g fill="none" stroke="#7fe8c4" stroke-opacity="0.45" stroke-width="2" transform="translate(22,22)">
      <polygon points="212,203 572,203 482,303 212,303"/>
      <polygon points="212,203 294,203 294,438 212,438"/>
      <polygon points="294,340 500,340 410,438 294,438"/>
      <polygon points="490,303 572,203 572,490 490,565 410,565 450,490"/>
    </g>
    <g fill="url(#glass)" fill-opacity="0.96" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">
      <polygon points="212,203 572,203 482,303 212,303"/>
      <polygon points="212,203 294,203 294,438 212,438"/>
      <polygon points="294,340 500,340 410,438 294,438"/>
      <polygon points="490,303 572,203 572,490 490,565 410,565 450,490"/>
    </g>
  </g>
</svg>
